<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>パートナーログイン | 白崎堂 SHIROSAKI-DO</title>
<link rel="stylesheet" href="sk-portal.css">
</head>
<body>
<header class="sk-top"><div class="in">
  <a class="sk-logo" href="index.html"><span class="sk-mark">白</span><span><b>白崎堂</b><small>SHIROSAKI-DO</small></span></a>
  <span class="sp"></span>
  <a class="sk-who" href="index.html">サイトへ戻る</a>
</div></header>

<main class="wrap narrow">
  <h1>パートナーポータル<span class="en">Partner portal</span></h1>
  <p class="lead">委託販売のお取引先さま専用ページです。ご注文、在庫、月次報告、請求書をここで管理できます。</p>

  <div class="tabs">
    <button data-tab="login">ログイン<span class="en">Log in</span></button>
    <button data-tab="signup">新規登録<span class="en">Register</span></button>
  </div>

  <div id="msg" class="note hidden"></div>

  <!-- LOGIN -->
  <section class="pane card" id="pane-login">
    <form id="f-login">
      <div class="field"><label>メールアドレス / E-mail</label><input type="email" name="email" required autocomplete="email"></div>
      <div class="field"><label>パスワード / Password</label><input type="password" name="password" required autocomplete="current-password"></div>
      <button class="btn block" type="submit">ログイン</button>
    </form>
    <p style="margin:14px 0 0"><button class="link" id="forgot">パスワードをお忘れの方 / Forgot password</button></p>
  </section>

  <!-- SIGN UP -->
  <section class="pane card" id="pane-signup">
    <form id="f-signup">
      <div class="field"><label>店舗・工房名 / Shop name *</label><input name="shop" required></div>
      <div class="grid2">
        <div class="field"><label>ご担当者名 / Contact person *</label><input name="contact" required></div>
        <div class="field"><label>電話番号 / Phone *</label><input name="phone" type="tel" required></div>
      </div>
      <div class="field"><label>店舗住所（納品先）/ Shop address *</label><input name="address" required></div>
      <div class="field"><label>ウェブサイト・SNS / Website</label><input name="website" placeholder="https://"></div>
      <div class="grid2">
        <div class="field"><label>メールアドレス / E-mail *</label><input type="email" name="email" required autocomplete="email"></div>
        <div class="field"><label>パスワード（8文字以上）/ Password *</label><input type="password" name="password" minlength="8" required autocomplete="new-password"></div>
      </div>
      <div class="field check">
        <input type="checkbox" id="agree" required>
        <label for="agree" style="margin:0;color:var(--ink);font-size:14px">
          <button type="button" class="link" id="open-terms">委託販売パートナー規約</button>を読み、同意します。<span class="en">I have read and agree to the Partner Terms.</span>
        </label>
      </div>
      <button class="btn block" type="submit" id="btn-signup">登録を申請する / Apply</button>
      <p class="muted" style="margin:12px 0 0">お申し込み後、確認メールが届きます。メール内のリンクを開いたあと、白崎堂が内容を確認し、承認されるとご利用いただけます。</p>
    </form>
  </section>
</main>

<!-- Terms popup -->
<div class="modal-bg hidden" id="terms-modal">
  <div class="modal">
    <div class="hd"><b>委託販売パートナー規約 / Partner Terms</b><button class="link" data-close>閉じる</button></div>
    <div class="bd" style="padding:0"><iframe src="partner-terms.html?embed=1" title="Partner Terms"></iframe></div>
    <div class="ft">
      <button class="btn ghost" data-close>閉じる / Close</button>
      <button class="btn" id="terms-agree">同意する / I agree</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sk-config.js"></script>
<script src="sk-common.js"></script>
<script>
(async function () {
  const msg = $('#msg');
  const params = new URLSearchParams(location.search);
  initTabs(() => msg.classList.add('hidden'));
  if (params.get('tab') === 'signup') $('.tabs [data-tab=signup]').click();

  // already logged in → go to dashboard
  const { data: { session } } = await sb.auth.getSession();
  if (session) { location.replace('partner.html'); return; }

  // terms popup
  const modal = $('#terms-modal');
  $('#open-terms').onclick = () => modal.classList.remove('hidden');
  $$('[data-close]', modal).forEach(b => b.onclick = () => modal.classList.add('hidden'));
  $('#terms-agree').onclick = () => { $('#agree').checked = true; modal.classList.add('hidden'); };

  // login
  $('#f-login').onsubmit = async e => {
    e.preventDefault();
    const f = e.target;
    const { error } = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.password.value });
    if (error) return showNote(msg, 'err', errText(error));
    location.href = 'partner.html';
  };

  // forgot password
  $('#forgot').onclick = async () => {
    const email = $('#f-login').email.value.trim();
    if (!email) return showNote(msg, 'warn', 'メールアドレスを入力してください / Enter your e-mail first');
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/partner.html?reset=1' });
    if (error) return showNote(msg, 'err', errText(error));
    showNote(msg, 'ok', 'パスワード再設定メールを送りました / Password reset e-mail sent');
  };

  // sign up
  $('#f-signup').onsubmit = async e => {
    e.preventDefault();
    const f = e.target;
    if (!$('#agree').checked) return showNote(msg, 'warn', '規約への同意が必要です / Please agree to the Terms');
    $('#btn-signup').disabled = true;
    const { data, error } = await sb.auth.signUp({
      email: f.email.value.trim(),
      password: f.password.value,
      options: {
        emailRedirectTo: location.origin + '/partner.html',
        data: {
          sk_shop_name: f.shop.value.trim(),
          sk_contact_name: f.contact.value.trim(),
          sk_phone: f.phone.value.trim(),
          sk_address: f.address.value.trim(),
          sk_website: f.website.value.trim(),
          sk_terms_version: SK.TERMS_VERSION
        }
      }
    });
    $('#btn-signup').disabled = false;
    if (error) return showNote(msg, 'err', errText(error));
    f.reset();
    if (data.session) { location.href = 'partner.html'; return; }
    showNote(msg, 'ok', 'お申し込みありがとうございます。確認メールのリンクを開いてください。承認後にご利用いただけます。 / Thank you! Please confirm your e-mail. We will approve your account shortly.');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
})();
</script>
</body>
</html>
